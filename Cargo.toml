[package]
name = "tacitty"
version = "0.1.0"
edition = "2021"
authors = ["Sriram P <sriram_297@yahoo.com>"]
repository = "https://github.com/Sriramm07/tacitty"
homepage = "https://github.com/Sriramm07/tacitty"
rust-version = "1.80"
description = "Prompt-aware password alias injector for Linux terminals: type @alias at any secret prompt and get the real secret from a local encrypted vault"
license = "PolyForm-Noncommercial-1.0.0"
readme = "README.md"
keywords = ["password", "pty", "terminal", "sudo", "vault"]
categories = ["command-line-utilities"]

[lib]
name = "tacitty"
path = "src/lib.rs"

[[bin]]
name = "tacitty"
path = "src/main.rs"

[dependencies]
age = "0.12"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
regex = "1"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
toml = "0.8"
vte = "0.15"
zeroize = "1"

[dev-dependencies]
libc = "0.2"
rexpect = "0.6.3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.deb]
name = "tacitty"
section = "utils"
priority = "optional"
assets = [
  ["target/release/tacitty", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/tacitty/README.md", "644"],
  ["contrib/*", "usr/share/doc/tacitty/contrib/", "644"],
]

[workspace]
members = ["."]
