# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "aarch64-unknown-linux-musl",
]

[advisories]
version = 2
ignore = [
    # `rsa` (pulled in by age's "ssh" feature, used only by `tacitty
    # export --to ssh-rsa ...` / `tacitty import -i id_rsa`) has no fixed
    # release for the Marvin timing attack. Exploiting it needs an attacker
    # who can make the victim run many RSA decryptions and time each one
    # precisely, i.e. a network-facing decryption oracle. tacitty does at
    # most one RSA decryption per `import`, run by hand, and encrypting to
    # an RSA public key involves no private-key operation at all.
    # Re-check when age moves to rsa 0.10.
    { id = "RUSTSEC-2023-0071", reason = "one-shot local RSA decryption is not a timing oracle; see comment" },
]

[licenses]
version = 2
# tacitty itself is MIT OR Apache-2.0; these are the licenses its
# dependency tree is actually allowed to use. Kept to exactly what's
# currently in the tree (checked via `cargo deny list`) rather than a
# generous preemptive list, so an unexpected new license shows up as a real
# CI failure instead of silently matching something already allowed.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # openssl has a much larger attack surface and a history of memory-safety
    # advisories that age/rustls-style pure-Rust crypto avoids; tacitty has
    # no reason to ever depend on it, directly or transitively.
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
