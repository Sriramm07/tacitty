# tacitty + tmux: wrap each PANE individually, not the tmux client.
#
# Wrapping `tmux attach` (or the client generally) puts tacitty's detection
# on the OUTSIDE of tmux's own pty multiplexing, so it only ever sees
# tmux's raw client pty — never the individual panes' termios (see
# "Known limitations" / nesting in the top-level README). Setting
# default-command instead runs `tacitty shell` as the process INSIDE each
# new pane, where it can see that pane's own termios directly.
#
# Source this from ~/.tmux.conf:
#   source-file ~/.config/tacitty/tacitty.tmux.conf
set -g default-command "tacitty shell"
