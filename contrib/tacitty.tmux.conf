# tacitty + tmux
#
# You don't need this if auto-start is on (`tacitty init` / `tacitty
# enable`): every tmux pane's shell then wraps itself automatically, because
# each pane is a terminal of its own that isn't wrapped yet.
#
# Without auto-start, wrapping only the tmux *client* isn't enough: the
# wrapper would only see tmux's own raw terminal, never the panes'. Setting
# default-command runs `tacitty shell` inside each new pane instead.
#
# Source this from ~/.tmux.conf:
#   source-file ~/.config/tacitty/tacitty.tmux.conf
set -g default-command "tacitty shell"
