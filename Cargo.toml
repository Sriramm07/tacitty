[package]
name = "tacitty"
version = "0.1.0"
edition = "2021"
authors = ["Sriram P <sriram_297@yahoo.com>"]
repository = "https://github.com/Sriramm07/tacitty"
homepage = "https://github.com/Sriramm07/tacitty"
rust-version = "1.80"
description = "Prompt-aware password alias injector for Linux and macOS terminals: type @alias at any secret prompt and get the real secret from a local encrypted vault"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["password", "pty", "terminal", "sudo", "vault"]
categories = ["command-line-utilities"]
# Ship only what `cargo install tacitty` needs: the source, README and
# licences. Repo-only material (the demo GIF, docs, CI, fuzzing, packaging,
# contrib) is left out of the published crate.
exclude = [
    "/assets",
    "/docs",
    "/contrib",
    "/packaging",
    "/fuzz",
    "/tests",
    "/.github",
    "/.cargo",
    "/ci",
    "/deny.toml",
    "/install.sh",
]

[lib]
name = "tacitty"
path = "src/lib.rs"

[[bin]]
name = "tacitty"
path = "src/main.rs"

[features]
# Test-only switches (fast scrypt via TACITTY_TEST_WORK_FACTOR, a local
# release server via TACITTY_RELEASES_URL). Off in every normal build so an
# environment variable can never weaken a real vault or redirect updates.
test-hooks = []

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["test-hooks"]

[dependencies]
age = { version = "0.12", features = ["armor", "ssh"] }
age-core = "0.12"
base64 = "0.22"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
libc = "0.2"
regex = "1"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
vte = "0.15"
zeroize = "1"

[dev-dependencies]
libc = "0.2"
rexpect = "0.6.3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Unwind (not abort) so that if tacitty ever panics, destructors still run:
# the terminal is put back to normal and secret buffers are wiped.

[workspace]
members = ["."]
