name: Release

# Push a tag like `v0.1.0` to publish a GitHub Release with static musl
# Linux binaries and macOS binaries (each x86_64 and aarch64) as .tar.gz +
# .sha256, plus a signed build provenance attestation for each. install.sh
# and `tacitty update` both download from these releases.
#
# Hardening:
# - Builds run with read-only permissions and no shared build cache; only
#   the final `publish` job can write to the repository.
# - Third-party actions are pinned to full commit SHAs (tag in the comment).
# - Anyone can check a download really came from this workflow with:
#     gh attestation verify <file> --repo Sriramm07/tacitty

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check tag matches Cargo.toml version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$tag" != "$ver" ]; then
            echo "tag v$tag does not match Cargo.toml version $ver" >&2
            exit 1
          fi
      # No release is built from a dependency tree with a known advisory, a
      # disallowed licence, a banned crate or an unknown source.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit
      - run: cargo audit
      # Nothing is released unless the whole test suite passes on Linux.
      # (macOS is covered by .github/workflows/macos.yml.)
      - name: tests
        env:
          TACITTY_TEST_WORK_FACTOR: "8"
        run: |
          cargo test --locked --lib
          cargo test --locked --features test-hooks --test integration -- --test-threads=1

  build:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.target }}

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The man page and completions come from the live CLI and are identical
      # for every architecture. We must not run a cross-built (aarch64)
      # binary on this x86_64 runner, so build a throwaway host-native binary
      # and generate them with that; the same files go into both tarballs.
      - name: generate man page and completions
        run: |
          cargo build --release --locked
          gen="$PWD/target/release/tacitty"
          mkdir -p gen/completions
          "$gen" man > gen/tacitty.1
          "$gen" completions bash > gen/completions/tacitty.bash
          "$gen" completions zsh  > gen/completions/_tacitty
          "$gen" completions fish > gen/completions/tacitty.fish

      - name: package tarball
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="tacitty-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/tacitty" README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cp gen/tacitty.1 "dist/$name/"
          cp -r gen/completions "dist/$name/completions"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          rm -rf "dist/$name"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Both macOS targets build on one Apple Silicon runner (Xcode's SDK
  # covers x86_64 too). Not codesigned or notarized: there's no Apple
  # Developer account. `curl | sh` installs aren't quarantined, so that
  # doesn't matter there; see docs/GUIDE.md for browser downloads.
  build-macos:
    name: build (${{ matrix.target }})
    needs: check
    runs-on: macos-15
    permissions:
      contents: read
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Apple Silicon kills binaries whose (ad-hoc, linker-made) signature
      # is broken, e.g. by stripping. Make sure this one actually runs.
      - name: smoke test
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          codesign --verify --verbose "target/${{ matrix.target }}/release/tacitty"
          "target/${{ matrix.target }}/release/tacitty" --version

      # As on Linux: generate the arch-independent man page and completions
      # from a host-native (aarch64) binary rather than running a cross-built
      # x86_64 binary on this Apple Silicon runner.
      - name: generate man page and completions
        run: |
          cargo build --release --locked
          gen="$PWD/target/release/tacitty"
          mkdir -p gen/completions
          "$gen" man > gen/tacitty.1
          "$gen" completions bash > gen/completions/tacitty.bash
          "$gen" completions zsh  > gen/completions/_tacitty
          "$gen" completions fish > gen/completions/tacitty.fish

      - name: package tarball
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="tacitty-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/tacitty" README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          cp gen/tacitty.1 "dist/$name/"
          cp -r gen/completions "dist/$name/completions"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
          rm -rf "dist/$name"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: [build, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance attestation
      attestations: write # store it
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*.tar.gz
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
